<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#181a20">
    <title>页面不存在 — 狗庄74</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        /* 独立页，不读 style.css —— v7「币安」配色 / 字体在此内联一份（改品牌色记得同步）。
           取值与 style.css 的 :root（深色默认）/ [data-theme="light"] 同源：深底 #181A20、主字 #EAECEF、品牌黄 #F0B90B，
           主按钮黄底深字。主站默认深色、不跟系统；这里没有切换钮 ⇒ 系统偏好浅色时给浅色版。 */
        @font-face{font-family:"IBM Plex Sans";src:url("/fonts/ibm-plex-sans-latin-wght-normal.woff2") format("woff2");font-weight:100 700;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
        :root{
            --bg:#181a20; --text:#eaecef; --muted:#929aa5;
            --accent-ink:#f0b90b; --btn-fill:#fcd535; --btn-fill-hover:#f0b90b; --btn-ink:#202630;
        }
        @media (prefers-color-scheme:light){
            :root{ --bg:#ffffff; --text:#1e2329; --muted:#474d57; --accent-ink:#8f6800; --btn-ink:#1e2329; }
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
            background:var(--bg); color:var(--text); min-height:100vh;
            display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
            -webkit-font-smoothing:antialiased;
        }
        .card{max-width:380px}
        .brand{display:inline-flex;align-items:center;gap:9px;margin-bottom:28px;font-weight:600;font-size:16px;letter-spacing:-.01em}
        .brand svg{width:26px;height:26px}
        .code{font-size:76px;font-weight:700;color:var(--accent-ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
        p{color:var(--muted);margin:16px 0 30px;font-size:14.5px;line-height:1.75}
        a.home{
            display:inline-block; background:var(--btn-fill); color:var(--btn-ink); font-weight:600;
            text-decoration:none; padding:11.5px 28px; border-radius:8px; font-size:14px;
            transition:background .15s;
        }
        a.home:hover{background:var(--btn-fill-hover)}
        a.home:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <svg viewBox="0 0 32 32" aria-hidden="true">
                <defs><linearGradient id="gm" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#fcd535"/><stop offset="1" stop-color="#f0b90b"/>
                </linearGradient></defs>
                <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#gm)"/>
                <rect x="7" y="17" width="4" height="8" rx="1.5" fill="#181a20"/>
                <rect x="14" y="12" width="4" height="13" rx="1.5" fill="#181a20"/>
                <rect x="21" y="7" width="4" height="18" rx="1.5" fill="#181a20"/>
            </svg>
            <span>狗庄74</span>
        </div>
        <div class="code">404</div>
        <p>这个页面不存在 —— 榜单都在首页。</p>
        <a class="home" href="/">回到排行榜</a>
    </div>
</body>
</html>
