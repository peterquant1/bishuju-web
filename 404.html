<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f0eee6">
    <title>页面不存在 — 狗庄74</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        /* 独立页,不读 style.css——v6「纸墨」配色/字体在此内联一份(改品牌色记得同步)。
           取值与 style.css 的 :root/[data-theme=dark] 同源:骨白页/象牙卡/墨字/赤陶强调。
           主按钮同样是**墨黑实心 + 象牙字**,暗色下反过来(象牙底 + 墨字)。 */
        @font-face{font-family:"Geist";src:url("/fonts/geist-latin.woff2") format("woff2");font-weight:100 900;font-display:swap}
        @font-face{font-family:"Geist Mono";src:url("/fonts/geist-mono-latin.woff2") format("woff2");font-weight:100 900;font-display:swap}
        :root{
            --bg:#f0eee6; --text:#141413; --muted:#5c5a54; --line:rgba(20,20,19,.1);
            --accent:#c6613f; --accent-ink:#a94a26; --panel:#faf9f5;
            --btn-fill:#141413; --btn-ink:#faf9f5;
        }
        @media (prefers-color-scheme:dark){
            :root{ --bg:#141413; --text:#f5f3ed; --muted:#a8a49a; --line:rgba(250,249,245,.11);
                   --accent:#e08a66; --accent-ink:#e08a66; --panel:#1c1b19;
                   --btn-fill:#f0eee6; --btn-ink:#141413; }
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
            background:var(--bg); color:var(--text); min-height:100vh;
            display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
            -webkit-font-smoothing:antialiased;
        }
        .card{max-width:380px}
        .brand{display:inline-flex;align-items:center;gap:9px;margin-bottom:28px;font-weight:600;font-size:16px;letter-spacing:-.01em}
        .brand svg{width:26px;height:26px}
        .code{font-size:76px;font-weight:600;color:var(--accent-ink);font-family:"Geist Mono",ui-monospace,Consolas,monospace;letter-spacing:-.03em;line-height:1}
        /* 说明文字走 Latin 衬线(CJK 落回无衬线),与主站 v6 的长文规矩一致 */
        p{color:var(--muted);margin:16px 0 30px;font-size:14.5px;line-height:1.75;font-family:Georgia,"PingFang SC","Microsoft YaHei",serif}
        a.home{
            display:inline-block; background:var(--btn-fill); color:var(--btn-ink); font-weight:600;
            text-decoration:none; padding:11.5px 28px; border-radius:8px; font-size:14px;
            transition:box-shadow .18s;
        }
        a.home:hover{box-shadow:0 2px 4px rgba(20,20,19,.1),0 8px 16px rgba(20,20,19,.12)}
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <svg viewBox="0 0 32 32" aria-hidden="true">
                <defs><linearGradient id="gm" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#d98363"/><stop offset="1" stop-color="#c6613f"/>
                </linearGradient></defs>
                <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#gm)"/>
                <rect x="7" y="17" width="4" height="8" rx="1.5" fill="#faf9f5"/>
                <rect x="14" y="12" width="4" height="13" rx="1.5" fill="#faf9f5"/>
                <rect x="21" y="7" width="4" height="18" rx="1.5" fill="#faf9f5"/>
            </svg>
            <span>狗庄74</span>
        </div>
        <div class="code">404</div>
        <p>这个页面不存在 —— 榜单都在首页。</p>
        <a class="home" href="/">回到排行榜</a>
    </div>
</body>
</html>
